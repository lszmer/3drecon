# Object turntable configuration (Step 1)
# Compatible with current PipelineConfigs parser (yuv_to_rgb, depth_to_linear, reconstruction)
# Additional sections are stubs for upcoming steps and are ignored by the current parser.

yuv_to_rgb:
  blur_filter: False
  blur_threshold: 50.0
  exposure_filter: False
  exposure_threshold_low: 0.05
  exposure_threshold_high: 0.05

depth_to_linear:
  clip_near_m: 0.1
  clip_far_m: 2.0
  use_cache: True

reconstruction:
  device: "CPU:0"

  # pipeline
  use_dataset_cache: false
  estimate_depth_confidences: true
  optimize_depth_pose: true
  use_fragment_dataset_cache: false
  use_optimized_dataset_cache: false
  use_colorless_vbg_cache: false
  visualize_colorless_pcd: true
  optimize_color_pose: true
  visualize_colored_mesh: true
  sample_point_cloud_from_colored_mesh: true
  points_per_vertex_ratio: 3.0
  render_color_aligned_depth: true

  confidence_estimation:
    target_frame_range: 10
    depth_max: 1.5
    error_threshold: 0.05
    skip_if_output_dir_exists: true
    use_multi_threading: false

  fragment_generation:
    fragment_size: 100
    use_confidence_filtered_depth: true
    confidence_threshold: 0.05
    valid_count_threshold: 4
    depth_max: 1.5
    odometry_loop_interval: 10
    overlap_ratio_threshold: 0.1
    loop_yaw_info_density_threshold: 0.3
    dist_threshold: 0.07
    edge_prune_threshold: 0.25
    use_multi_threading: false

  fragment_pose_refinement:
    use_confidence_filtered_depth: true
    confidence_threshold: 0.05
    valid_count_threshold: 4
    voxel_size: 0.005
    block_resolution: 16
    block_count: 40000
    depth_max: 1.5
    trunc_voxel_multiplier: 8.0
    use_pre_filtering: true
    pre_filter_every_k_points: 30
    pre_filter_max_corr_dist: 0.08
    pre_filter_inlier_rmse_threshold: 0.05
    pre_filter_fitness_threshold: 0.2
    icp_voxel_sizes: [0.04, 0.02, 0.01]
    max_corr_dists: [0.08, 0.04, 0.02]
    max_iterations: [50, 31, 14]
    relative_fitnesses: [1e-6, 1e-6, 1e-6]
    relative_rmses: [1e-6, 1e-6, 1e-6]
    icp_fitness_threshold: 0.2
    icp_inlier_rmse_threshold: 0.05
    dist_threshold: 0.07
    edge_prune_threshold: 0.25
    use_multi_threading: false

  depth_integration:
    use_confidence_filtered_depth: true
    confidence_threshold: 0.05
    valid_count_threshold: 4
    voxel_size: 0.01
    block_resolution: 16
    block_count: 50000
    depth_max: 1.5
    trunc_voxel_multiplier: 8.0

  color_optimization:
    weight_threshold: 3.0
    estimated_vertex_number: -1
    interval: 100
    max_iteration: 300
    use_dataset_cache: true

  color_aligned_depth_rendering:
    weight_threshold: 3.0
    estimated_vertex_number: -1
    only_use_optimized_dataset: true

# --- Stubs for upcoming steps (ignored by current parser) ---
object_mode: true
assume_shared_intrinsics: true

frame_selection:
  sample_by_time_step: 3
  target_frame_count: 200

masking:
  enable: true
  strategy: depth_threshold_then_morphology
  depth_threshold_m: { min: 0.2, max: 2.0 }
  morphology: { open: 3, close: 5 }
  fill_holes: true

preprocessing:
  use_depth_roi_mask: true
  depth_roi_meters: { min: 0.2, max: 2.0 }
  use_circular_roi: true
  circular_roi_pixels: { cx: null, cy: null, r: null }

colmap:
  matcher: sequential
  sequential_overlap: 5
  max_num_models: 1
  refine_focal_length: false
  refine_principal_point: false
  refine_extra_params: false
  camera_model: SIMPLE_RADIAL

alignment:
  enable: true
  method: pca_plane_fit
  align_up_to: +Z
  center_to_origin: true

reconstruction_bounds:
  strategy: sparse_cloud_auto
  margin_m: 0.05
  manual_sphere: { cx: 0.0, cy: 0.0, cz: 0.0, r: 0.4 }

fusion:
  method: tsdf
  voxel_size_m: 0.0025
  sdf_trunc_m: 0.02
  use_mask: true
  crop_to_bounds: true

meshing:
  method: marching_cubes
  min_component_volume_voxels: 1000
  decimate_target_faces: 100000

texturing:
  enable: true
  color_map_optimization: true
  luma_weight: 0.8
  gradient_weight: 0.2

presets:
  quick:
    frame_selection: { target_frame_count: 80 }
    fusion: { voxel_size_m: 0.005 }
  quality:
    frame_selection: { target_frame_count: 300 }
    fusion: { voxel_size_m: 0.0025 }

